name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Разрешения выдаём каждому job по минимуму (least-privilege).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.sln

      - name: Build
        run: dotnet build src/backend/RentControl/RentControl.sln --no-restore -c Release

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.UnitTests

      - name: Run unit tests
        run: dotnet test src/backend/RentControl/RentControl.UnitTests --no-restore -c Release

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.IntegrationTests

      - name: Run integration tests
        run: dotnet test src/backend/RentControl/RentControl.IntegrationTests --no-restore -c Release

  # Неблокирующие проверки: allowed to fail, мерж не запрещают.
  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.E2ETests

      - name: Run e2e tests
        run: dotnet test src/backend/RentControl/RentControl.E2ETests --no-restore -c Release
