name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.sln

      - name: Build
        run: dotnet build src/backend/RentControl/RentControl.sln --no-restore -c Release
