name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Разрешения выдаём каждому job по минимуму (least-privilege).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.sln

      - name: Build
        run: dotnet build src/backend/RentControl/RentControl.sln --no-restore -c Release

  # Неблокирующие проверки: allowed to fail, мерж не запрещают.
  # Цепочка: build -> e2e-tests -> docker-build.
  # continue-on-error у e2e-tests гарантирует, что при его падении docker-build не скипнется.
  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.E2ETests

      - name: Run e2e tests
        run: dotnet test src/backend/RentControl/RentControl.E2ETests --no-restore -c Release

  docker-build:
    needs: e2e-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service: [Main.Api, Payments.Api, Realtime.Api, Main.Worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image (${{ matrix.service }})
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -f src/backend/RentControl/$SERVICE/Dockerfile -t "rentcontrol-${SERVICE,,}:ci" src/backend/RentControl

  # AI-ревью PR через OpenCodeReview (https://github.com/alibaba/open-code-review).
  # Запускается при создании PR в main и на каждый пуш в него — только после
  # успешного билда (needs: build). Action сам ставит OCR, конфигурирует LLM,
  # сравнивает ветку с main и публикует inline-комментарии + summary в PR.
  #
  # Требуется секрет: ZAI_API_KEY — API-ключ GLM Coding Plan от z.ai
  # (Settings -> Secrets and variables -> Actions). Нет секрета — ревью
  # пропускается. Любые сбои ревью не блокируют PR (continue-on-error):
  # в merge не встаёт и не горит красным.
  ai-review:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    continue-on-error: true
    # Новый пуш отменяет ещё не закончившееся ревью этого же PR.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Проверка ключа z.ai (нет ключа — ревью пропускается)
        id: key
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -z "${ZAI_API_KEY:-}" ]; then
            echo "::warning::Секрет ZAI_API_KEY не задан (Settings -> Secrets and variables -> Actions) — AI-ревью пропущено."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AI-ревью (OpenCodeReview, glm-5.3-flash)
        if: steps.key.outputs.skip != 'true'
        # Пин на полный commit SHA (теги мутабельны): action получает секрет
        # ZAI_API_KEY, поэтому компрометация ссылки = утечка ключа.
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb # v1.13.3
        with:
          # GLM Coding Plan ходит через отдельный OpenAI-совместимый эндпоинт
          # (не общий https://api.z.ai/api/paas/v4).
          llm_url: "https://api.z.ai/api/coding/paas/v4/chat/completions"
          llm_auth_token: ${{ secrets.ZAI_API_KEY }}
          llm_model: glm-5.3-flash
          llm_use_anthropic: 'false'
          # CLI пиним тем же тегом, что и action; при обновлении менять оба.
          ocr_version: '1.13.3'
          language: Russian
