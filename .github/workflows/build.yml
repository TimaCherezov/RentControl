name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.sln

      - name: Build
        run: dotnet build src/backend/RentControl/RentControl.sln --no-restore -c Release

  # Неблокирующие проверки: allowed to fail, мерж не запрещают.
  # Цепочка: build -> e2e-tests -> docker-build.
  # continue-on-error у e2e-tests гарантирует, что при его падении docker-build не скипнется.
  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/backend/RentControl/RentControl.E2ETests

      - name: Run e2e tests
        run: dotnet test src/backend/RentControl/RentControl.E2ETests --no-restore -c Release

  docker-build:
    needs: e2e-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service: [Main.Api, Payments.Api, Realtime.Api, Main.Worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image (${{ matrix.service }})
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -f src/backend/RentControl/$SERVICE/Dockerfile -t "rentcontrol-${SERVICE,,}:ci" src/backend/RentControl
