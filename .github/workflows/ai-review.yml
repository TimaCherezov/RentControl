name: AI Review

# Ревью пулл-реквестов через OpenCode (скилл `pr-review`) на модели z.ai.
#
# Когда запускается: после успешного завершения workflow "Build" по пушу в PR
# (событие workflow_run). Никаких sleep и ожиданий на раннерах — задачи
# стартуют только под реальную работу.
#
# Логика:
#   1. resolve (лёгкая задача, секунды): находит PR по sha закоммиченного
#      билда, отбрасывает форки, черновики, устаревшие коммиты и уже
#      отревьюенное. Состояние ревью — commit status `ai-review`:
#        pending  = ревью в работе (защита от дублей)
#        success  = готово (повторно не запускается)
#        error    = не удалось (повтор при следующей successful-сборке или вручную)
#   2. review: OpenCode прогоняет скилл pr-review и публикует в PR сводный
#      комментарий и построчные комментарии.
#
# Ручной запуск: Actions -> AI Review -> Run workflow (номер PR, force —
# повторить ревью того же коммита), или `gh workflow run ai-review.yml -f pr=10`.
#
# Требуется секрет: ZAI_API_KEY — ключ z.ai (Settings -> Secrets and variables -> Actions).
# Опционально переменная REVIEW_MODEL, по умолчанию zai/glm-4.7
# (для ключа из подписки Z.AI Coding Plan — zai-coding-plan/glm-4.7).
#
# Примечание: событие workflow_run срабатывает только для workflow,
# находящихся в ветке по умолчанию (заработает после мержа).

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Номер PR для ревью'
        type: number
        required: true
      force:
        description: 'Повторить ревью, даже если оно уже готово'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'zai/glm-4.7' }}
  CLAIM_STALE_MINUTES: '60'
  # Пин мажорной версии OpenCode; заодно ключ кеша установки.
  # Поднять при выходе новой мажорной версии (или задать variable OPENCODE_VERSION).
  OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '2' }}

jobs:
  resolve:
    # Только успешные билды по пушам в PR (или ручной запуск).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.r.outputs.pr }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - name: Поиск PR по sha билда и проверки готовности
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          FORCE: ${{ inputs.force }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="" ; sha="" ; reason=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
              echo "::error::input 'pr' должен быть номером PR, получено: '${INPUT_PR}'"
              exit 1
            fi
            pr="$INPUT_PR"
            force="$FORCE"
          else
            force="false"
            # Только открытые PR; для форк-PR sha может быть недоступен
            # (gh вернёт ошибку в stdout) — валидируем число и тихо пропускаем.
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${WR_SHA}/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // empty' 2>/dev/null || true)"
            if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
              echo "Билд ${WR_SHA:0:12} не связан с открытым PR — ревью не требуется."
              pr=""
            fi
          fi

          if [ -n "$pr" ]; then
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
              --jq '{sha: .head.sha, fork: (.head.repo.fork // false), draft: .draft, state: .state}')"
            sha="$(jq -r '.sha' <<<"$meta")"
            fork="$(jq -r '.fork' <<<"$meta")"
            draft="$(jq -r '.draft' <<<"$meta")"
            prstate="$(jq -r '.state' <<<"$meta")"

            if [ "$fork" != "false" ]; then
              reason="PR из форка"
            elif [ "$prstate" != "open" ]; then
              reason="PR ${prstate}"
            elif [ "$draft" = "true" ]; then
              reason="черновик"
            elif [ "$force" != "true" ] && [ -n "${WR_SHA:-}" ] && [ "$sha" != "$WR_SHA" ]; then
              reason="голова уже ${sha:0:12} — ревью придёт после билда нового коммита"
            fi

            if [ -z "$reason" ]; then
              latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/statuses" \
                --jq '[.[] | select(.context == "ai-review")] | sort_by(.created_at) | last // empty')"
              if [ -n "$latest" ] && [ "$force" != "true" ]; then
                state="$(jq -r '.state' <<<"$latest")"
                if [ "$state" = "success" ]; then
                  reason="ревью ${sha:0:12} уже готово"
                elif [ "$state" = "pending" ]; then
                  age=$(( ( $(date +%s) - $(date -d "$(jq -r '.created_at' <<<"$latest")" +%s) ) / 60 ))
                  if [ "$age" -lt "$CLAIM_STALE_MINUTES" ]; then
                    reason="ревью ${sha:0:12} уже в работе (${age} мин)"
                  fi
                fi
              fi
            fi

            if [ -n "$reason" ]; then
              echo "PR #${pr}: ${reason} — пропускаем."
            else
              {
                echo "pr=${pr}"
                echo "sha=${sha}"
              } >> "$GITHUB_OUTPUT"
              echo "PR #${pr}: коммит ${sha:0:12} — запускаем ревью."
            fi
          fi

  review:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Свежий билд того же PR отменяет ещё не закончившееся ревью старого коммита.
      group: ai-review-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      HEAD_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: "Заявка на ревью (commit status: pending)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context=ai-review \
            -f description="OpenCode: ревью запущено" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.resolve.outputs.pr }}/head
          # Полная история, чтобы ревьюер мог смотреть контекст файлов.
          fetch-depth: 0

      - name: Кеш OpenCode (бинарник ~500 МБ — качаем только при смене версии)
        uses: actions/cache@v4
        with:
          path: /tmp/opencode-cli
          key: opencode-cli-${{ env.OPENCODE_VERSION }}

      - name: Установка OpenCode
        run: |
          if [ ! -x /tmp/opencode-cli/node_modules/.bin/opencode ]; then
            npm install --prefix /tmp/opencode-cli "@opencode/cli@${OPENCODE_VERSION}"
          fi
          echo "/tmp/opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"
          opencode --version

      - name: Выгрузка diff и описания PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '"## " + .title + "\n\n" + (.body // "")' > "$RUNNER_TEMP/pr.md"

      - name: Запуск ревью (opencode run + скилл pr-review)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_API_KEY }}
          REVIEW_DIFF: ${{ runner.temp }}/pr.diff
          REVIEW_META: ${{ runner.temp }}/pr.md
          REVIEW_REPORT: ${{ runner.temp }}/review.md
          REVIEW_COMMENTS: ${{ runner.temp }}/comments.json
        run: |
          if [ -z "${ZHIPU_API_KEY:-}" ]; then
            echo "::error::Секрет ZAI_API_KEY не задан. Добавьте его в Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          opencode run --standalone --auto --model "$REVIEW_MODEL" \
            "@pr-review Сделай ревью этого пулл-реквеста. Diff — в файле из \$REVIEW_DIFF, описание PR — в файле из \$REVIEW_META. Пройди весь цикл по инструкции скилла."

      - name: Публикация ревью в PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPORT: ${{ runner.temp }}/review.md
          REVIEW_COMMENTS: ${{ runner.temp }}/comments.json
        run: bash .github/scripts/ai-review/publish.sh

      - name: Итоговый статус ревью
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=success -f context=ai-review -f description="Ревью опубликовано" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=error -f context=ai-review -f description="Ревью не удалось — повторится после следующего успешного билда" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
