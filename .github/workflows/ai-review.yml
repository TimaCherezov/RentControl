name: AI Review

# AI-ревью пулл-реквестов: OpenCode (скилл `pr-review`) на модели z.ai.
# Запускается при создании PR и на каждый пуш в него.
# Вся логика шагов — в .github/scripts/ai-review/.
#
# Требуется секрет: ZAI_API_KEY — ключ z.ai (Settings -> Secrets and variables -> Actions).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Новый пуш отменяет ещё не закончившееся ревью этого же PR.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_MODEL: zai/glm-4.7
  # Пин мажорной версии OpenCode; заодно ключ кеша установки.
  OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION || '2' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: ревьюер сам сравнивает ветку с origin/<base>.
          fetch-depth: 0

      - name: Кеш OpenCode (бинарник ~500 МБ — качаем только при смене версии)
        uses: actions/cache@v4
        with:
          path: /tmp/opencode-cli
          key: opencode-cli-${{ env.OPENCODE_VERSION }}

      - name: Установка OpenCode
        run: bash .github/scripts/ai-review/install.sh

      - name: Ревью (opencode + скилл pr-review)
        env:
          GH_TOKEN: ${{ github.token }}
          ZHIPU_API_KEY: ${{ secrets.ZAI_API_KEY }}
          REVIEW_REPORT: ${{ runner.temp }}/review.md
          REVIEW_COMMENTS: ${{ runner.temp }}/comments.json
        run: bash .github/scripts/ai-review/review.sh

      - name: Публикация ревью в PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPORT: ${{ runner.temp }}/review.md
          REVIEW_COMMENTS: ${{ runner.temp }}/comments.json
        run: bash .github/scripts/ai-review/publish.sh
