# ── Realtime.Api ────────────────────────────────────────────────────────────
# Пока шаблонный сервис (только /weatherforecast): сюда в будущем переедет
# SignalR-консьюмер OrderChanged. Деплоим для полноты стека.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-api
  namespace: rentcontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-api
  template:
    metadata:
      labels:
        app: realtime-api
    spec:
      containers:
        - name: realtime-api
          image: rentcontrol/realtime-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-api
  namespace: rentcontrol
spec:
  type: NodePort
  selector:
    app: realtime-api
  ports:
    - port: 80
      targetPort: http
      nodePort: 30082
