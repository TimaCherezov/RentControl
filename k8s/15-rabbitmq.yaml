# ── RabbitMQ ────────────────────────────────────────────────────────────────
# Брокер сообщений для интеграционных событий (MassTransit): OrderCreated,
# InvoiceCreated, PaymentSucceeded. Образ с тегом -management включает
# веб-UI на порту 15672 — открываем наружу через NodePort 30672.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: rentcontrol
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: rentcontrol
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            # Встроенный guest/guest запрещён для сетевых подключений,
            # поэтому создаём свою учётку — её используют и поды сервисов
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-password
          # Ловушка: дефолтный timeoutSeconds у проб = 1 секунда, а Erlang-утилита
          # rabbitmq-diagnostics стартует несколько секунд — без увеличенного
          # таймаута проба «убивает» здоровый брокер (CrashLoopBackOff)
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
# Service для сервисов: они подключаются по amqp://rabbitmq:5672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rentcontrol
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: amqp
---
# Service для человека: веб-UI брокера наружу через NodePort.
# http://<minikube-ip>:30672 (логин/пароль — из Secret app-secrets)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-ui
  namespace: rentcontrol
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - port: 15672
      targetPort: management
      nodePort: 30672
