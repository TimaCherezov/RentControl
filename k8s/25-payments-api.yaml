apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: rentcontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: rentcontrol/payments-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: rentcontrol
spec:
  type: NodePort
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: http
      nodePort: 30081
