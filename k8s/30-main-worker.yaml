apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-worker
  namespace: rentcontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-worker
  template:
    metadata:
      labels:
        app: main-worker
    spec:
      containers:
        - name: main-worker
          image: rentcontrol/main-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
