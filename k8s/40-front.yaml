apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: rentcontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: rentcontrol/front:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: rentcontrol
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 80
      targetPort: http
      nodePort: 30083
