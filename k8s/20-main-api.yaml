apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: main-api-uploads
  namespace: rentcontrol
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-api
  namespace: rentcontrol
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: main-api
  template:
    metadata:
      labels:
        app: main-api
    spec:
      # контейнер работает без root (USER $APP_UID), том нужен ему
      initContainers:
        - name: fix-uploads-permissions
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 1654:1654 /app/uploads"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: main-api
          image: rentcontrol/main-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: main-api-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: main-api
  namespace: rentcontrol
spec:
  type: NodePort
  selector:
    app: main-api
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
